<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه فیلم و سریال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #f5c842;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(245, 200, 66, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #8888aa;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .category {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 1.8rem;
            color: #f5c842;
            border-right: 4px solid #f5c842;
            padding-right: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title span {
            font-size: 1rem;
            color: #8888aa;
            font-weight: normal;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #f5c842;
            box-shadow: 0 10px 30px rgba(245, 200, 66, 0.1);
        }

        .card-poster-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #0a0a18;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-poster-container img {
            transform: scale(1.03);
        }

        .card-poster-container .no-poster {
            color: #666688;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.4;
        }

        .card-title-en {
            font-size: 0.85rem;
            color: #8888aa;
            font-weight: normal;
            direction: ltr;
            display: block;
            margin-top: 2px;
        }

        .card-year {
            background: #f5c842;
            color: #0f0f1a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .card-genre {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 12px 0;
        }

        .genre-tag {
            background: #2a2a4a;
            color: #bbbbdd;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            border: 1px solid #3a3a5a;
        }

        .card-synopsis {
            font-size: 0.9rem;
            color: #c0c0d0;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 12px;
        }

        .card-search-term {
            font-size: 0.7rem;
            color: #555577;
            border-top: 1px solid #2a2a4a;
            padding-top: 8px;
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        .card-search-term::before {
            content: "🔍 ";
            color: #f5c842;
            font-family: 'Segoe UI', sans-serif;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
            .card-title {
                font-size: 1rem;
            }
            .card-poster-container {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 کتابخانه فیلم و سریال</h1>
        <p class="subtitle">لیست کامل فیلم‌ها و سریال‌ها به همراه پوستر، ژانر، سال و خلاصه داستان</p>

        <div class="category">
            <div class="category-title">🎥 فیلم‌های سینمایی <span>(سینمای جهان)</span></div>
            <div class="grid" id="movieGrid"></div>
        </div>

        <div class="category">
            <div class="category-title">📺 سریال‌ها <span>(مجموعه‌های تلویزیونی)</span></div>
            <div class="grid" id="seriesGrid"></div>
        </div>

        <div class="category">
            <div class="category-title">🧸 انیمیشن و کارتون <span>(پویانمایی)</span></div>
            <div class="grid" id="animationGrid"></div>
        </div>

        <div class="category">
            <div class="category-title">🥋 فیلم‌های رزمی و اکشن <span>(Martial Arts & Action)</span></div>
            <div class="grid" id="actionGrid"></div>
        </div>

        <div class="category">
            <div class="category-title">🇮🇷🇮🇳 فیلم‌های فارسی، هندی و سایر</div>
            <div class="grid" id="otherGrid"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // دیتابیس فیلم‌ها با TMDB ID برای دریافت پوستر
        // ============================================================

        // TMDB ID رو می‌تونید از سایت themoviedb.org پیدا کنید
        // یا می‌تونید از جستجوی خودکار استفاده کنید (کد پایین)

        const movies = [
            { titleFa: "تلقین", titleEn: "Inception", year: 2010, tmdbId: "27205", genre: ["اکشن", "ماجراجویی", "علمی‑تخیلی"], synopsis: "دزدی که رازها را از درون رویاها می‌دزدد، برای کاشتن یک ایده در ذهن یک مدیرعامل مأمور می‌شود." },
            { titleFa: "حیثیت", titleEn: "The Prestige", year: 2006, tmdbId: "1124", genre: ["درام", "معمایی", "علمی‑تخیلی"], synopsis: "دو شعبده‌باز رقیب در لندن قرن نوزدهم، برای خلق توهم نهایی جنگی تلخ و وسواس‌آمیز دارند." },
            { titleFa: "میان‌ستاره‌ای", titleEn: "Interstellar", year: 2014, tmdbId: "157336", genre: ["ماجراجویی", "درام", "علمی‑تخیلی"], synopsis: "گروهی از کاوشگران از یک کرم‌چاله در فضا عبور می‌کنند تا نجات بشریت را ممکن کنند." },
            { titleFa: "علاءالدین", titleEn: "Aladdin", year: 2019, tmdbId: "420817", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "بازسازی زنده‌نمای قصه کلاسیک. یک ولگرد خیابانی با کمک یک جن جادویی، قلب پرنسس یاسمین را به دست می‌آورد." },
            { titleFa: "دامبو", titleEn: "Dumbo", year: 2019, tmdbId: "420809", genre: ["ماجراجویی", "خانوادگی", "فانتزی"], synopsis: "بازسازی زنده‌نمای فیل کوچکی که با گوش‌های بزرگش می‌تواند پرواز کند." },
            { titleFa: "فارست گامپ", titleEn: "Forrest Gump", year: 1994, tmdbId: "13", genre: ["درام", "کمدی-درام", "عاشقانه"], synopsis: "مردی با ضریب هوشی پایین، در چند دهه تاریخ آمریکا به‌صورت تصادفی در رویدادهای بزرگ نقش می‌کند." },
            { titleFa: "مردان شجاع", titleEn: "Legends of the Fall", year: 1995, tmdbId: "1259", genre: ["درام", "وسترن", "عاشقانه"], synopsis: "در اوایل قرن بیستم، سه برادر در مونتانا عاشق یک زن می‌شوند و این عشق مسیر زندگیشان را تغییر می‌دهد." },
            { titleFa: "بیگانه", titleEn: "Arrival", year: 2016, tmdbId: "329865", genre: ["علمی‑تخیلی", "درام", "معمایی"], synopsis: "زبان‌شناسی تلاش می‌کند با موجودات فضایی ارتباط برقرار کند و به درکی جدید از زمان می‌رسد." },
            { titleFa: "زیبای خفته", titleEn: "Beauty and the Beast", year: 2017, tmdbId: "321612", genre: ["فانتزی", "عاشقانه", "خانوادگی"], synopsis: "دختری کتاب‌خوان به قلعه جانوری می‌رود تا پدرش را نجات دهد." },
            { titleFa: "جوخه هیولاها", titleEn: "Pacific Rim", year: 2013, tmdbId: "68726", genre: ["اکشن", "علمی‑تخیلی", "ماجراجویی"], synopsis: "هیولاهایی از اعماق دریا به زمین حمله می‌کنند و انسان‌ها ربات‌های غول‌پیکر می‌سازند." },
            { titleFa: "آماده کننده یک", titleEn: "Ready Player One", year: 2018, tmdbId: "333339", genre: ["ماجراجویی", "علمی‑تخیلی", "اکشن"], synopsis: "در سال 2045، نوجوانی در دنیای مجازی به دنبال گنج پنهان می‌گردد." },
            { titleFa: "تام ریدر", titleEn: "Tomb Raider", year: 2018, tmdbId: "338970", genre: ["اکشن", "ماجراجویی", "فانتزی"], synopsis: "لارا کرافت به سفری خطرناک می‌رود تا راز ناپدید شدن پدرش را کشف کند." }
        ];

        const series = [
            { titleFa: "تاج و تخت", titleEn: "Game of Thrones", year: "۲۰۱۱-۲۰۱۹", tmdbId: "1399", genre: ["فانتزی", "درام", "حماسی"], synopsis: "هفت پادشاهی برای نشستن بر تخت آهنین می‌جنگند، در حالی که تهدید یخ‌زده‌ای در حال پیشروی است." },
            { titleFa: "تاریکی", titleEn: "Dark", year: "۲۰۱۷-۲۰۲۰", tmdbId: "70523", genre: ["علمی‑تخیلی", "معمایی", "هیجان‌انگیز"], synopsis: "ناپدید شدن کودکان، شبکه‌ای از روابط خانوادگی و سفرهای زمانی را آشنا می‌کند." },
            { titleFa: "خانه کاغذی", titleEn: "Money Heist", year: "۲۰۱۷-۲۰۲۱", tmdbId: "71446", genre: ["جنایی", "هیجان‌انگیز", "درام"], synopsis: "گروهی از سارقان به رهبری «پروفسور» نقشه دستبرد به ضرابخانه اسپانیا را طرح می‌کنند." },
            { titleFa: "پیکی بلایندرز", titleEn: "Peaky Blinders", year: "۲۰۱۳-۲۰۲۲", tmdbId: "60574", genre: ["جنایی", "درام", "تاریخی"], synopsis: "خلافکاران بیرمنگام به ریاست تامی شلبی امپراتوری خود را گسترش می‌دهند." },
            { titleFa: "کبرا کای", titleEn: "Cobra Kai", year: "۲۰۱۸-۲۰۲۵", tmdbId: "77328", genre: ["کمدی-درام", "اکشن", "ورزشی"], synopsis: "۳۰ سال پس از «بچه کاراته‌کار»، رقابت جانی و دنی دوباره شعله‌ور می‌شود." }
        ];

        const animations = [
            { titleFa: "ابومینبل", titleEn: "Abominable", year: 2019, tmdbId: "451048", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "دختری با یک موجود افسانه‌ای دوست می‌شود و به کوه‌های هیمالیا سفر می‌کند." },
            { titleFa: "ماشین‌ها ۳", titleEn: "Cars 3", year: 2017, tmdbId: "360339", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "لایتنینگ مک‌کوئین با نسلی جدید از ماشین‌های سریعتر روبرو می‌شود." },
            { titleFa: "دوری را پیدا کن", titleEn: "Finding Dory", year: 2016, tmdbId: "227156", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "دوری، ماهی فراموشکار، برای پیدا کردن خانواده‌اش به اقیانوس آرام سفر می‌کند." },
            { titleFa: "هتل ترانسیلوانیا ۳", titleEn: "Hotel Transylvania 3", year: 2018, tmdbId: "400160", genre: ["کمدی", "خانوادگی", "فانتزی"], synopsis: "دراکولا و دوستانش به سفر دریایی می‌روند و عاشق کاپیتان کشتی می‌شود." },
            { titleFa: "چگونه اژدهایت را تربیت کنی ۳", titleEn: "How to Train Your Dragon 3", year: 2019, tmdbId: "166428", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "بیرک و اژدهایش از مخفیگاه پنهان اژدهاها محافظت می‌کنند." },
            { titleFa: "شگفت‌انگیزان ۲", titleEn: "Incredibles 2", year: 2018, tmdbId: "260513", genre: ["اکشن", "ماجراجویی", "خانوادگی"], synopsis: "خانواده سوپرمن‌ها برای بازگرداندن اعتبار خود به جامعه ماموریت جدیدی دارند." },
            { titleFa: "شرک", titleEn: "Shrek", year: 2001, tmdbId: "808", genre: ["کمدی", "ماجراجویی", "خانوادگی"], synopsis: "یک غول سبز برای نجات شاهزاده‌ای با یک خر حرف‌زن همراه می‌شود." },
            { titleFa: "داستان اسباب‌بازی ۴", titleEn: "Toy Story 4", year: 2019, tmdbId: "301528", genre: ["ماجراجویی", "کمدی", "خانوادگی"], synopsis: "وودی و دوستانش با اسباب‌بازی جدیدی به نام «آلی» آشنا می‌شوند." },
            { titleFa: "اسم تو", titleEn: "Your Name", year: 2016, tmdbId: "372058", genre: ["درام", "عاشقانه", "فانتزی"], synopsis: "دو نوجوان در ژاپن به‌طور مرموزی بدن‌هایشان را با یکدیگر عوض می‌کنند." }
        ];

        const actionMovies = [
            { titleFa: "کرید ۲", titleEn: "Creed II", year: 2018, tmdbId: "480530", genre: ["اکشن", "درام", "ورزشی"], synopsis: "آدونیس کرید برای انتقام پدرش با پسر ایوان دراگو وارد رینگ بوکس می‌شود." },
            { titleFa: "دانگل", titleEn: "Dangal", year: 2016, tmdbId: "297802", genre: ["اکشن", "بیوگرافی", "درام"], synopsis: "داستان واقعی کشتی‌گیری که دو دخترش را قهرمان کشتی جهان می‌کند." },
            { titleFa: "ایپ من ۴", titleEn: "Ip Man 4", year: 2019, tmdbId: "566762", genre: ["اکشن", "بیوگرافی", "درام"], synopsis: "استاد وینگ‌چون برای یافتن مدرسه به آمریکا می‌رود و با تنش‌های نژادی روبرو می‌شود." },
            { titleFa: "پاندای کونگ‌فوکار", titleEn: "Kung Fu Panda", year: 2008, tmdbId: "9502", genre: ["کمدی", "اکشن", "انیمیشن"], synopsis: "یک پاندا تنبل برای رسیدن به رویای خود استاد کونگ فو می‌شود." }
        ];

        const otherMovies = [
            { titleFa: "بچه رئیس", titleEn: "Boss Baby", year: 2017, tmdbId: "295693", genre: ["کمدی", "خانوادگی", "انیمیشن"], synopsis: "یک نوزاد کت‌وشلوارپوش با توانایی‌های خاص به مقابله با یک توطئه می‌رود." },
            { titleFa: "شیر شاه", titleEn: "The Lion King", year: 2019, tmdbId: "420818", genre: ["ماجراجویی", "درام", "خانوادگی"], synopsis: "سیمبا، شیر جوان، برای گرفتن جایگاهش به عنوان پادشاه با گذشته خود روبرو می‌شود." },
            { titleFa: "تنها در خانه ۵", titleEn: "Home Alone 5", year: 2012, tmdbId: "186935", genre: ["کمدی", "خانوادگی"], synopsis: "پسر کوچکی برای محافظت از خانه در برابر دزدها نقشه‌های بامزه می‌کشد." }
        ];

        // ============================================================
        // تابع دریافت پوستر از TMDB
        // ============================================================

        function getPosterUrl(tmdbId) {
            if (!tmdbId) return null;
            return `https://image.tmdb.org/t/p/w500/${tmdbId}.jpg`;
        }

        // ============================================================
        // تابع تولید کارت
        // ============================================================

        function renderCards(data, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            let html = '';
            data.forEach(item => {
                const posterUrl = getPosterUrl(item.tmdbId);
                const genreTags = item.genre.map(g => `<span class="genre-tag">${g}</span>`).join('');
                
                let posterHtml = '';
                if (posterUrl) {
                    posterHtml = `<img src="${posterUrl}" alt="${item.titleEn} poster" loading="lazy" onerror="this.style.display='none'">`;
                } else {
                    posterHtml = `<div class="no-poster">📽️ پوستر موجود نیست</div>`;
                }
                
                html += `
                    <div class="card">
                        <div class="card-poster-container">
                            ${posterHtml}
                        </div>
                        <div class="card-header">
                            <div class="card-title">
                                ${item.titleFa}
                                <span class="card-title-en">${item.titleEn}</span>
                            </div>
                            <span class="card-year">${item.year}</span>
                        </div>
                        <div class="card-genre">${genreTags}</div>
                        <div class="card-synopsis">${item.synopsis}</div>
                        <div class="card-search-term">${item.titleEn} ${item.year}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============================================================
        // اجرای رندر
        // ============================================================

        renderCards(movies, 'movieGrid');
        renderCards(series, 'seriesGrid');
        renderCards(animations, 'animationGrid');
        renderCards(actionMovies, 'actionGrid');
        renderCards(otherMovies, 'otherGrid');
    </script>
</body>
</html>
